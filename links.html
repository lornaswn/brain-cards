<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>我的小程序 · 链接组</title>
<style>
  :root{--bg:#0f1b30;--c:#1b2a4a;--acc:#4F6DF5;--acc2:#7a90ff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(130% 90% at 50% 0%,#24406e,#0f1b30);color:#eaf0fb;min-height:100vh;}
  .wrap{max-width:480px;margin:0 auto;padding:26px 18px 40px;}
  .logo{font-size:13px;letter-spacing:1px;color:#9fb4d4;text-align:center;margin-bottom:6px;}
  h1{font-size:25px;text-align:center;margin:0 0 6px;font-weight:800;}
  .sub{text-align:center;color:#b9c8e2;font-size:13px;line-height:1.6;margin:0 0 22px;}
  .card{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 16px;margin-bottom:14px;
    display:flex;align-items:center;gap:14px;transition:.15s;}
  .card:active{transform:scale(.985);}
  .ic{width:54px;height:54px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:28px;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px rgba(79,109,245,.35);}
  .meta{flex:1;min-width:0;}
  .nm{font-size:16px;font-weight:700;}
  .ds{font-size:12.5px;color:#aebdd8;margin-top:3px;line-height:1.5;}
  .go{flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--acc);
    padding:8px 14px;border-radius:999px;}
  .card.todo{border-style:dashed;opacity:.92;}
  .card.todo .ic{background:linear-gradient(135deg,#5a6b86,#3a4860);box-shadow:none;}
  .card.todo .go{background:rgba(255,255,255,.16);color:#cdd9ee;}
  .note{margin-top:18px;font-size:12px;color:#8ba0c4;line-height:1.7;text-align:center;
    background:rgba(255,255,255,.05);border-radius:14px;padding:14px;}
  .note b{color:#cdddff;}
  .foot{text-align:center;font-size:11px;color:#6f84a8;margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">脑宇宙 · 产品入口</div>
  <h1>我的小程序 · 链接组</h1>
  <p class="sub">一页直达你所有的学习与育儿小程序<br>手机打开即可，长按可分享给家长群</p>

  <!-- 已上线：脑宇宙家长小程序（本仓库 parent-app） -->
  <a class="card" href="parent-app/index.html">
    <div class="ic">🧠</div>
    <div class="meta">
      <div class="nm">脑宇宙 · 家长小程序</div>
      <div class="ds">脑科学教养扑克 · 17 脑区家长手册 + 每日一抽 + 情境断案 + 铲屎官</div>
    </div>
    <div class="go">打开 ›</div>
  </a>

  <!-- 陈宋菲英语培训：真实小程序链接待补充（把下方 href 换成真实网址/小程序路径即可） -->
  <a class="card todo" href="#chen-link-todo" onclick="alert('陈宋菲英语培训的小程序链接待补充：把真实网址/小程序路径发给我，我立刻填进去并重建此页。');return false;">
    <div class="ic">🔤</div>
    <div class="meta">
      <div class="nm">陈宋菲英语培训</div>
      <div class="ds">中小学英语听说 / 单词发音练习（用有道远程发音）<br><span style="color:#ffd479">⚠ 真实链接待补充</span></div>
    </div>
    <div class="go">待填 ›</div>
  </a>

  <div class="note">
    <b>怎么补链接？</b><br>
    把陈宋菲英语培训小程序的<b>真实网址 / 小程序路径 / 二维码内容</b>发给我，
    我直接替换上面那条「待填」入口，重建后立刻可点。<br>
    新增别的产品也一样——发链接给我，我加进这个链接组。
  </div>
  <div class="foot">脑宇宙工作室 · 链接组 v1（自包含静态页）</div>
</div>
</body>
</html>
